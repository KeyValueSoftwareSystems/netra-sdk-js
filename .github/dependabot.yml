# Weekly dependency and GitHub Actions updates (JS-SEC-026).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      traceloop:
        patterns: ["@traceloop/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
